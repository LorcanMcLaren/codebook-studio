name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to publish, for example v1.2.1"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Validate release tag
        run: |
          if ! printf '%s' "$RELEASE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must look like v1.2.1; got '$RELEASE_TAG'." >&2
            exit 1
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Validate citation metadata
        run: |
          python - <<'PY'
          import re
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          if f'version: "{tag}"' not in citation:
              raise SystemExit(f"CITATION.cff version must match {tag}.")
          if f"Version {tag}" not in readme or f"version = {{{tag}}}" not in readme:
              raise SystemExit(f"README citation examples must match {tag}.")
          if not re.search(r"^date-released: \d{4}-\d{2}-\d{2}$", citation, re.MULTILINE):
              raise SystemExit("CITATION.cff must include an ISO date-released field.")
          PY

      - name: Run tests
        run: pytest -q

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag
