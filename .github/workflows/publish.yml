name: Publish Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish, for example v1.2.1. Defaults to CITATION.cff."
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: publish-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        env:
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            release_tag="${GITHUB_REF_NAME}"
          elif [ -n "$INPUT_TAG" ]; then
            release_tag="$INPUT_TAG"
          else
            release_tag="$(sed -n 's/^version: "\([^"]*\)"$/\1/p' CITATION.cff | head -n 1)"
            if [ -z "$release_tag" ]; then
              echo "CITATION.cff does not contain a quoted version field." >&2
              exit 1
            fi
          fi

          if ! printf '%s' "$release_tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Release tag must look like v1.2.1; got '$release_tag'." >&2
            exit 1
          fi

          echo "tag=$release_tag" >> "$GITHUB_OUTPUT"

      - name: Check out existing tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
            git checkout "$RELEASE_TAG"
          else
            echo "Tag $RELEASE_TAG does not exist yet; it will be created from this commit after validation."
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Validate citation metadata
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          python - <<'PY'
          import re
          import os
          from pathlib import Path

          tag = os.environ["RELEASE_TAG"]
          citation = Path("CITATION.cff").read_text(encoding="utf-8")
          readme = Path("README.md").read_text(encoding="utf-8")

          if f'version: "{tag}"' not in citation:
              raise SystemExit(f"CITATION.cff version must match {tag}.")
          if f"Version {tag}" not in readme or f"version = {{{tag}}}" not in readme:
              raise SystemExit(f"README citation examples must match {tag}.")
          if not re.search(r"^date-released: \d{4}-\d{2}-\d{2}$", citation, re.MULTILINE):
              raise SystemExit("CITATION.cff must include an ISO date-released field.")
          PY

      - name: Run tests
        run: pytest -q

      - name: Create release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if git rev-parse -q --verify "refs/tags/$RELEASE_TAG" >/dev/null; then
            echo "Tag $RELEASE_TAG already exists."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "$RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists."
            exit 0
          fi

          gh release create "$RELEASE_TAG" \
            --title "$RELEASE_TAG" \
            --generate-notes \
            --verify-tag \
          || gh release view "$RELEASE_TAG"
